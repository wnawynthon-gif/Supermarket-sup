<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการสั่งของ — Th/Ch sup</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --cream: #faf6ef;
    --ink: #2c2416;
    --ink-light: #6b5c44;
    --accent: #c0392b;
    --accent-soft: #e8d5d3;
    --green: #2d6a4f;
    --green-soft: #d8f3dc;
    --border: #d4c4a8;
    --shadow: rgba(44,36,22,0.12);
    --gold: #b7860b;
    --gold-soft: #fef9e7;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--cream);
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(192,57,43,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(45,106,79,0.04) 0%, transparent 50%);
    font-family: 'Sarabun', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }
  .page-wrap { max-width: 1080px; margin: 0 auto; }

  /* HEADER */
  .header {
    text-align: center; margin-bottom: 2rem;
    padding-bottom: 1.2rem; border-bottom: 2px solid var(--border); position: relative;
  }
  .header::after {
    content:''; display:block; width:60px; height:3px;
    background:var(--accent); margin:0.5rem auto 0; border-radius:2px;
  }
  .header h1 { font-family:'Playfair Display',serif; font-size:2rem; color:var(--ink); margin-bottom:0.3rem; }
  .header .subtitle { font-size:0.85rem; color:var(--ink-light); letter-spacing:0.08em; text-transform:uppercase; }

  /* DATE ROW */
  .date-row { display:flex; align-items:center; gap:0.75rem; margin-bottom:1.5rem; font-size:0.85rem; color:var(--ink-light); }
  .date-row label { font-weight:600; }
  .date-row input[type="date"] {
    font-family:'Sarabun',sans-serif; font-size:0.85rem; border:1px solid var(--border);
    background:white; color:var(--ink); padding:0.35rem 0.7rem; border-radius:6px; outline:none; cursor:pointer;
  }
  .date-row input:focus { border-color:var(--accent); }

  /* CATEGORY BADGE */
  .category-label {
    display:inline-block; font-size:0.7rem; font-weight:700; letter-spacing:0.1em;
    text-transform:uppercase; padding:0.2rem 0.6rem; border-radius:3px; margin:1.4rem 0 0.5rem;
  }
  .cat-meat { background:#fde8e8; color:#922b21; }
  .cat-produce { background:var(--green-soft); color:var(--green); }
  .cat-dairy { background:#fef9e7; color:#7d6608; }
  .cat-fish { background:#e8f4fd; color:#1a5276; }
  .cat-other { background:#f4ecf7; color:#6c3483; }

  /* ITEM CARD — num | name | price | current | target | auto order | unit | delete */
  .item-card {
    display: grid;
    grid-template-columns: 26px minmax(180px,1fr) 92px 82px 82px 92px 42px 22px;
    align-items: center;
    gap: 0.6rem;
    padding: 0.65rem 0.9rem;
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 0.45rem;
    transition: all 0.18s ease;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .item-card:hover { border-color:var(--accent); box-shadow:0 3px 10px var(--shadow); transform:translateY(-1px); }
  .item-card.has-qty { background:linear-gradient(to right,#fff9f9,white); border-left:3px solid var(--accent); }

  .item-num { font-size:0.7rem; color:var(--ink-light); font-weight:700; text-align:right; }

  .item-info .item-name { font-size:0.92rem; font-weight:500; color:var(--ink); line-height:1.3; }
  .item-info .price-hint { display:block; font-size:0.68rem; color:var(--ink-light); margin-top:0.1rem; font-weight:300; }
  .note-input {
    width:100%; margin-top:0.35rem;
    font-family:'Sarabun',sans-serif; font-size:0.75rem; color:var(--ink);
    border:1px dashed var(--border); border-radius:5px; padding:0.25rem 0.45rem;
    background:var(--cream); outline:none; resize:none;
  }
  .note-input:focus { border-color:var(--accent); background:white; }

  /* PRICE INPUT */
  .price-wrap {
    display:flex; align-items:center; gap:3px;
    background: var(--gold-soft);
    border: 1px solid #e0c96a;
    border-radius: 7px;
    padding: 0.28rem 0.5rem;
  }
  .price-wrap .currency { font-size:0.75rem; color:var(--gold); font-weight:700; }
  .price-input {
    width: 58px; border:none; background:transparent;
    font-family:'Sarabun',sans-serif; font-size:0.9rem; font-weight:600;
    color:var(--gold); text-align:right; outline:none;
  }
  .price-input::placeholder { color:#d4b96a; font-weight:400; }
  .price-input::-webkit-inner-spin-button,
  .price-input::-webkit-outer-spin-button { -webkit-appearance:none; }

  /* QTY */
  .qty-wrap { display:flex; align-items:center; gap:0.35rem; }
  .qty-btn {
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border);
    background:var(--cream); color:var(--ink); font-size:1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.15s; font-weight:600; flex-shrink:0;
  }
  .qty-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .qty-input {
    width:44px; height:32px; text-align:center; border:1.5px solid var(--border);
    border-radius:7px; font-family:'Sarabun',sans-serif; font-size:1rem; font-weight:600;
    color:var(--ink); background:white; outline:none; transition:border-color 0.15s;
  }
  .qty-input:focus { border-color:var(--accent); }
  .qty-input::-webkit-inner-spin-button,
  .qty-input::-webkit-outer-spin-button { -webkit-appearance:none; }
  .unit-label { font-size:0.68rem; color:var(--ink-light); }


  .stock-input, .order-input {
    width:100%; height:36px; text-align:center;
    border:1.5px solid var(--border); border-radius:7px;
    font-family:'Sarabun',sans-serif; font-size:0.95rem; font-weight:700;
    outline:none; background:white;
  }
  .stock-input:focus { border-color:var(--green); }
  .order-input { background:#fff2f0; color:var(--accent); border-color:#e7b9b4; }
  .stock-label-mobile { display:none; font-size:.62rem; color:var(--ink-light); margin-bottom:3px; text-align:center; }
  @media (max-width: 820px) {
    .col-headers { display:none; }
    .item-card {
      grid-template-columns: 24px 1fr 72px 72px 72px;
      gap:.45rem; padding:.7rem;
    }
    .item-info { grid-column:2/-1; }
    .price-wrap { grid-column:2; }
    .current-wrap { grid-column:3; }
    .target-wrap { grid-column:4; }
    .order-wrap { grid-column:5; }
    .unit-label { grid-column:5; text-align:center; }
    .delete-btn { position:absolute; right:8px; top:8px; }
    .item-card { position:relative; }
    .stock-label-mobile { display:block; }
    .price-wrap { align-self:end; }
  }

  /* TOTAL BAR */
  .total-bar {
    display:grid; grid-template-columns:1fr 1fr 1fr;
    align-items:center; padding:1rem 1.4rem;
    background:var(--ink); color:white; border-radius:12px;
    margin:1.6rem 0; box-shadow:0 4px 16px rgba(44,36,22,0.25);
    gap: 0.5rem;
  }
  .total-bar .tb-col { text-align:center; }
  .total-bar .tb-col:first-child { text-align:left; }
  .total-bar .tb-col:last-child { text-align:right; }
  .total-bar .label { font-size:0.72rem; opacity:0.6; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:0.2rem; }
  .total-bar .count { font-size:1.3rem; font-weight:700; font-family:'Playfair Display',serif; }
  .total-bar .grand-total { font-size:1.5rem; color:#f8d56e; }

  /* SUMMARY */
  .summary-section {
    margin-top:1.2rem; padding:1rem 1.2rem;
    background:white; border:1px solid var(--border); border-radius:12px;
  }
  .summary-section h3 { font-family:'Playfair Display',serif; font-size:1rem; margin-bottom:0.8rem; color:var(--ink); border-bottom:1px solid var(--border); padding-bottom:0.5rem; }
  .summary-item {
    display:grid; grid-template-columns:1fr 60px 80px 90px;
    align-items:center; padding:0.35rem 0;
    font-size:0.82rem; border-bottom:1px dotted #ede3d4;
    gap:0.5rem;
  }
  .summary-item:last-child { border-bottom:none; }
  .summary-item .s-name { color:var(--ink); }
  .summary-item .s-qty { font-weight:700; color:var(--accent); text-align:center; }
  .summary-item .s-price { color:var(--gold); text-align:right; font-size:0.78rem; }
  .summary-item .s-subtotal { font-weight:700; color:var(--ink); text-align:right; }
  .summary-header { display:grid; grid-template-columns:1fr 60px 80px 90px; gap:0.5rem; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-light); padding:0 0 0.4rem; margin-bottom:0.2rem; border-bottom:2px solid var(--border); }
  .summary-header span:nth-child(2) { text-align:center; }
  .summary-header span:nth-child(3),
  .summary-header span:nth-child(4) { text-align:right; }
  .summary-grand {
    display:flex; justify-content:space-between; align-items:center;
    margin-top:0.8rem; padding:0.6rem 0.8rem;
    background:var(--ink); color:white; border-radius:8px;
    font-weight:700;
  }
  .summary-grand .sg-label { font-size:0.85rem; opacity:0.8; }
  .summary-grand .sg-total { font-family:'Playfair Display',serif; font-size:1.3rem; color:#f8d56e; }

  /* BUTTONS */
  .actions { display:flex; gap:0.8rem; flex-wrap:wrap; }
  .btn {
    flex:1; min-width:130px; padding:0.85rem 1.2rem; border:none; border-radius:10px;
    font-family:'Sarabun',sans-serif; font-size:0.88rem; font-weight:700; cursor:pointer;
    letter-spacing:0.04em; transition:all 0.18s ease;
    display:flex; align-items:center; justify-content:center; gap:0.5rem;
  }
  .btn-secondary { background:white; color:var(--ink); border:1.5px solid var(--border); }
  .btn-secondary:hover { border-color:var(--ink); transform:translateY(-2px); box-shadow:0 4px 12px var(--shadow); }
  .btn-green { background:var(--green); color:white; box-shadow:0 3px 10px rgba(45,106,79,0.3); }
  .btn-green:hover { background:#1e4d38; transform:translateY(-2px); box-shadow:0 6px 18px rgba(45,106,79,0.4); }
  .icon { font-size:1.05rem; }

  /* COLUMN HEADERS for item list */
  .col-headers {
    display:grid; grid-template-columns:26px minmax(180px,1fr) 92px 82px 82px 92px 42px 22px;
    gap:0.6rem; padding:0 0.9rem 0.3rem;
    font-size:0.65rem; font-weight:700; text-transform:uppercase;
    letter-spacing:0.07em; color:var(--ink-light);
  }
  .col-headers span:nth-child(n+3) { text-align:center; }

  /* PDF */
  #pdf-area {
    display:none; font-family:'Sarabun',sans-serif;
    background:white; padding:24px; width:842px; box-sizing:border-box; color:#1a1a1a;
  }
  #pdf-area h2 { font-family:'Playfair Display',serif; font-size:20px; margin-bottom:4px; color:#2c2416; text-align:center; }
  #pdf-area .pdf-sub { text-align:center; font-size:11px; color:#888; margin-bottom:16px; padding-bottom:10px; border-bottom:1.5px solid #ddd; }
  #pdf-area table { width:100%; table-layout:fixed; border-collapse:collapse; font-size:10px; }
  #pdf-area th { background:#2c2416; color:white; padding:6px 5px; text-align:left; font-weight:600; }
  #pdf-area th.right { text-align:right; }
  #pdf-area td { padding:6px 5px; border-bottom:1px solid #eee; vertical-align:top; overflow-wrap:anywhere; word-break:break-word; line-height:1.3; }
  #pdf-area td.right { text-align:right; }
  #pdf-area tr:nth-child(even) td { background:#faf6ef; }
  #pdf-area .pdf-total-row td { background:#2c2416 !important; color:white; font-weight:700; border-bottom:none; }
  #pdf-area .pdf-total-row td.right { color:#f8d56e; font-size:14px; }
  #pdf-area .footer-note { margin-top:10px; font-size:10px; color:#aaa; text-align:right; }

  /* DELETE BUTTON on item card */
  .item-card { grid-template-columns: 26px minmax(180px,1fr) 92px 82px 82px 92px 42px 22px; }
  .delete-btn {
    width:22px; height:22px; border-radius:50%; border:1.5px solid #e8c8c8;
    background:#fff0f0; color:#c0392b; font-size:0.85rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.15s; flex-shrink:0; line-height:1;
    opacity:0.45;
  }
  .delete-btn:hover { opacity:1; background:#fde8e8; border-color:var(--accent); transform:scale(1.1); }
  .item-card.custom-item { border-style: dashed; }
  .custom-badge {
    display:inline-block; font-size:0.6rem; font-weight:700; letter-spacing:0.06em;
    text-transform:uppercase; padding:0.1rem 0.35rem; border-radius:3px;
    background:#e8f0fe; color:#1a56c4; margin-left:0.4rem; vertical-align:middle;
  }

  /* ADD ITEM PANEL */
  .add-item-bar {
    margin-top: 1rem;
    border: 2px dashed var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .add-item-bar:hover { border-color: var(--green); }
  .add-item-toggle {
    width:100%; padding:0.75rem 1rem;
    background: transparent; border:none; cursor:pointer;
    font-family:'Sarabun',sans-serif; font-size:0.88rem; font-weight:700;
    color:var(--green); display:flex; align-items:center; justify-content:center;
    gap:0.5rem; letter-spacing:0.04em; transition:background 0.15s;
  }
  .add-item-toggle:hover { background: var(--green-soft); }
  .add-item-toggle .toggle-icon { font-size:1.2rem; transition:transform 0.2s; }
  .add-item-toggle.open .toggle-icon { transform: rotate(45deg); }

  .add-item-form {
    display:none; padding:1rem 1.2rem 1.2rem;
    background: white; border-top:1px solid var(--border);
  }
  .add-item-form.open { display:block; }

  .form-row {
    display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; margin-bottom:0.7rem;
  }
  .form-row.three { grid-template-columns:1fr 1fr 1fr; }
  .form-group { display:flex; flex-direction:column; gap:0.3rem; }
  .form-group label { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--ink-light); }
  .form-group input, .form-group select {
    font-family:'Sarabun',sans-serif; font-size:0.9rem; color:var(--ink);
    border:1.5px solid var(--border); border-radius:7px; padding:0.4rem 0.6rem;
    background:white; outline:none; transition:border-color 0.15s;
  }
  .form-group input:focus, .form-group select:focus { border-color:var(--green); }
  .form-group input::placeholder { color:#c5b49a; }

  .btn-add-confirm {
    width:100%; padding:0.75rem; border:none; border-radius:9px;
    background:var(--green); color:white; font-family:'Sarabun',sans-serif;
    font-size:0.9rem; font-weight:700; cursor:pointer; letter-spacing:0.04em;
    display:flex; align-items:center; justify-content:center; gap:0.5rem;
    transition:all 0.18s; box-shadow:0 2px 8px rgba(45,106,79,0.25);
    margin-top:0.3rem;
  }
  .btn-add-confirm:hover { background:#1e4d38; transform:translateY(-1px); box-shadow:0 4px 14px rgba(45,106,79,0.35); }

  /* UPDATE col-headers too */
  .col-headers { grid-template-columns: 26px 1fr 100px auto 30px 22px; }

  @media(max-width:520px){
    .item-card { grid-template-columns:22px 1fr 88px auto 26px 20px; gap:0.4rem; padding:0.6rem 0.6rem; }
    .col-headers { grid-template-columns:22px 1fr 88px auto 26px 20px; gap:0.4rem; padding:0 0.6rem 0.3rem; }
    .summary-item { grid-template-columns:1fr 48px 70px 75px; }
    .summary-header { grid-template-columns:1fr 48px 70px 75px; }
    .total-bar .count { font-size:1.1rem; }
    .form-row { grid-template-columns:1fr; }
    .form-row.three { grid-template-columns:1fr 1fr; }
  }
</style>
</head>
<body>
<div class="page-wrap">

  <div class="header">
    <h1>🛒 รายการสั่งของ</h1>
    <div class="subtitle">Sainsbury’s Weekly Order · Receipt-based stock</div>
  </div>

  <div class="date-row">
    <label>วันที่:</label>
    <input type="date" id="order-date">
  </div>

  <div class="col-headers">
    <span>#</span><span>รายการ</span><span>ราคา</span>
    <span>คงเหลือ</span><span>Stock ที่ต้องมี</span><span>ต้องสั่ง</span><span>หน่วย</span><span></span>
  </div>

  <div id="item-list"></div>

  <!-- ADD ITEM PANEL -->
  <div class="add-item-bar" id="add-item-bar">
    <button class="add-item-toggle" id="add-toggle-btn" onclick="toggleAddForm()">
      <span class="toggle-icon">＋</span> เพิ่มรายการใหม่
    </button>
    <div class="add-item-form" id="add-item-form">
      <div class="form-row">
        <div class="form-group" style="grid-column:1/-1">
          <label>ชื่อสินค้า *</label>
          <input type="text" id="new-name" placeholder="เช่น ขิง, น้ำมันมะกอก...">
        </div>
      </div>
      <div class="form-row three">
        <div class="form-group">
          <label>หมวดหมู่</label>
          <select id="new-cat">
            <option value="other">🧴 อื่นๆ</option>
            <option value="meat">🥩 เนื้อสัตว์</option>
            <option value="fish">🐟 ปลา</option>
            <option value="dairy">🥛 นม</option>
            <option value="produce">🥬 ผักและผลไม้</option>
          </select>
        </div>
        <div class="form-group">
          <label>หน่วย</label>
          <input type="text" id="new-unit" placeholder="กก. / ถุง / ขวด">
        </div>
        <div class="form-group">
          <label>ราคา/หน่วย (£)</label>
          <input type="number" id="new-price" min="0" step="0.01" placeholder="0.00">
        </div>
      </div>
      <button class="btn-add-confirm" onclick="addNewItem()">
        ✅ เพิ่มรายการนี้
      </button>
    </div>
  </div>

  <div class="total-bar">
    <div class="tb-col">
      <div class="label">รายการที่เลือก</div>
      <div class="count" id="selected-count">0 รายการ</div>
    </div>
    <div class="tb-col">
      <div class="label">จำนวนรวม</div>
      <div class="count" id="total-qty">0 ชิ้น</div>
    </div>
    <div class="tb-col">
      <div class="label">ยอดรวมทั้งหมด</div>
      <div class="count grand-total" id="grand-total">£0.00</div>
    </div>
  </div>

  <div class="summary-section" id="summary-section" style="display:none">
    <h3>📋 สรุปรายการที่สั่ง</h3>
    <div class="summary-header">
      <span>รายการ</span><span>จำนวน</span><span>ราคา/หน่วย</span><span>รวม</span>
    </div>
    <div id="summary-list"></div>
    <div class="summary-grand" id="summary-grand" style="display:none">
      <span class="sg-label">ยอดรวมทั้งหมด</span>
      <span class="sg-total" id="summary-total">£0.00</span>
    </div>
  </div>

  <div class="actions" style="margin-top:1.2rem">
    <button class="btn btn-secondary" onclick="clearAll()">
      <span class="icon">🗑</span> ล้างทั้งหมด
    </button>
    <button class="btn btn-green" onclick="savePDF()">
      <span class="icon">📄</span> บันทึก PDF
    </button>
    <button class="btn btn-green" onclick="sharePDF()">
      <span class="icon">💬</span> ส่ง LINE
    </button>
  </div>

</div>

<!-- Hidden PDF render area -->
<div id="pdf-area">
  <h2>🛒 รายการสั่งของ</h2>
  <div class="pdf-sub" id="pdf-date-label"></div>
  <table>
    <thead>
      <tr>
        <th style="width:26px">#</th>
        <th>รายการ</th>
        <th class="right" style="width:70px">ราคา/หน่วย</th>
        <th class="right" style="width:70px">ต้องสั่ง</th>
        <th class="right" style="width:75px">รวม</th>
        <th style="width:110px">หมายเหตุ</th>
      </tr>
    </thead>
    <tbody id="pdf-rows"></tbody>
  </table>
  <div class="footer-note" id="pdf-footer"></div>
</div>

<script>
const items = [
  {id:1,name:'Coca-Cola Original Taste',hint:'24 × 330ml · receipt 02/07/26',cat:'other',unit:'case',defaultPrice:15.25,supplier:'Sainsbury’s'},
  {id:2,name:'Coca-Cola Zero Sugar',hint:'24 × 330ml · latest receipt 11/07/26',cat:'other',unit:'case',defaultPrice:8.00,supplier:'Sainsbury’s'},

const catMeta = {
  meat:    { label:'🥩 เนื้อสัตว์',      cls:'cat-meat' },
  produce: { label:'🥬 ผักและผลไม้',     cls:'cat-produce' },
  dairy:   { label:'📦 บรรจุภัณฑ์ / นม', cls:'cat-dairy' },
  fish:    { label:'❄️ แช่แข็ง',          cls:'cat-fish' },
  other:   { label:'🧂 แห้ง / เครื่องปรุง', cls:'cat-other' },
};

const state = {};
const stockTargetsFromLatestPDF = {1:2,2:3,3:6,4:6,5:3,6:3,7:3,8:5,9:8,10:5,11:8,12:3,13:2,14:5,15:3};
const defaultTargets = Object.fromEntries(items.map(i => [i.id, stockTargetsFromLatestPDF[i.id] ?? 0]));
// v11 uses the latest PDF Stock column as the baseline target stock.
const savedTargets = JSON.parse(localStorage.getItem('sainsburys-target-stock-v14') || '{}');
items.forEach(i => {
  const target = Number(savedTargets[i.id] ?? defaultTargets[i.id] ?? 0);
  state[i.id] = { current:0, target, qty:target, price: i.defaultPrice, note:'' };
});

const dateEl = document.getElementById('order-date');
dateEl.value = new Date().toISOString().split('T')[0];

function fmt(n) { return n != null ? '£' + n.toFixed(2) : '–'; }

const supplierOrder = ['Sainsbury’s'];
function orderedItems() { return [...items].sort((a,b) => { const sa=supplierOrder.indexOf(getSupplier(a)), sb=supplierOrder.indexOf(getSupplier(b)); return sa!==sb ? sa-sb : a.id-b.id; }); }
function displayNumber(item) { return item.id; }

function renderItems() {
  const container = document.getElementById('item-list');
  container.innerHTML = '';
  supplierOrder.forEach(supplier => {
    const supplierItems = orderedItems().filter(i => getSupplier(i) === supplier);
    if (!supplierItems.length) return;
    const badge = document.createElement('div');
    badge.className = 'category-label cat-other';
    badge.textContent = supplier === 'Sainsbury’s' ? '🛒 Sainsbury’s Weekly Order' : `🏪 ${supplier}`;
    container.appendChild(badge);

    supplierItems.forEach(item => {
      const s = state[item.id];
      const card = document.createElement('div');
      card.className = 'item-card' + (s.qty > 0 ? ' has-qty' : '') + (item.custom ? ' custom-item' : '');
      card.id = `card-${item.id}`;
      const priceVal = s.price != null ? s.price : '';
      card.innerHTML = `
        <span class="item-num">${displayNumber(item)}</span>
        <div class="item-info">
          <span class="item-name">${item.name}
            ${item.hint ? `<span class="price-hint">${item.hint}</span>` : ''}${item.custom ? `<span class="custom-badge">ใหม่</span>` : ''}
          </span>
          <textarea class="note-input" rows="1" placeholder="หมายเหตุ..."
            oninput="updateNote(${item.id},this.value)">${s.note}</textarea>
        </div>
        <div class="price-wrap">
          <span class="currency">£</span>
          <input class="price-input" type="number" min="0" step="0.01"
            value="${priceVal}" placeholder="0.00"
            oninput="setPrice(${item.id},this.value)"
            onblur="cleanPrice(${item.id},this)"
          >
        </div>
        <div class="current-wrap">
          <span class="stock-label-mobile">คงเหลือ</span>
          <input class="stock-input current-input" type="number" min="0" step="1"
            value="${s.current ? s.current : ''}" placeholder="0"
            oninput="setStock(${item.id},'current',this.value)">
        </div>
        <div class="target-wrap">
          <span class="stock-label-mobile">Stock</span>
          <input class="stock-input target-input" type="number" min="0" step="1"
            value="${s.target ?? 0}" placeholder="0"
            oninput="setStock(${item.id},'target',this.value)">
        </div>
        <div class="order-wrap">
          <span class="stock-label-mobile">ต้องสั่ง</span>
          <input class="order-input qty-input" type="number" value="${s.qty||0}" readonly>
        </div>
        <span class="unit-label">${item.unit}</span>
        <button class="delete-btn" onclick="deleteItem(${item.id})" title="ลบรายการ">✕</button>
      `;
      container.appendChild(card);
    });
  });
  updateSummary();
}

function setStock(id, field, val) {
  let n = parseFloat(val);
  n = isNaN(n) ? 0 : Math.max(0, n);
  state[id][field] = n;
  if (field === 'target') {
    const saved = JSON.parse(localStorage.getItem('sainsburys-target-stock-v14') || '{}');
    saved[id] = n;
    localStorage.setItem('sainsburys-target-stock-v14', JSON.stringify(saved));
  }
  state[id].qty = Math.max(0, (state[id].target || 0) - (state[id].current || 0));
  const order = document.querySelector(`#card-${id} .order-input`);
  if (order) order.value = state[id].qty;
  updateCard(id);
  updateSummary();
}

function setPrice(id, val) {
  const n = parseFloat(val);
  state[id].price = isNaN(n) ? null : Math.max(0, n);
  updateSummary();
}

function cleanPrice(id, el) {
  if (state[id].price != null) {
    el.value = state[id].price.toFixed(2);
  } else {
    el.value = '';
  }
}

function updateNote(id, val) { state[id].note = val; }

function updateCard(id) {
  const card = document.getElementById(`card-${id}`);
  if (!card) return;
  if (state[id].qty > 0) card.classList.add('has-qty');
  else card.classList.remove('has-qty');
}

function calcGrand() {
  return items.reduce((sum, item) => {
    const s = state[item.id];
    if (s.qty > 0 && s.price != null) return sum + s.qty * s.price;
    return sum;
  }, 0);
}

function updateSummary() {
  const selected = items.filter(i => state[i.id].qty > 0);
  const totalQty  = selected.reduce((s,i) => s + state[i.id].qty, 0);
  const grand     = calcGrand();
  const hasAnyPrice = selected.some(i => state[i.id].price != null);

  document.getElementById('selected-count').textContent = `${selected.length} รายการ`;
  document.getElementById('total-qty').textContent = `${totalQty} ชิ้น`;
  document.getElementById('grand-total').textContent = hasAnyPrice ? `£${grand.toFixed(2)}` : '–';

  const summarySection = document.getElementById('summary-section');
  const summaryList    = document.getElementById('summary-list');
  const summaryGrand   = document.getElementById('summary-grand');

  if (selected.length === 0) {
    summarySection.style.display = 'none';
    return;
  }

  summarySection.style.display = 'block';
  summaryList.innerHTML = selected.map(item => {
    const s = state[item.id];
    const priceStr = s.price != null ? `£${s.price.toFixed(2)}` : '–';
    const subtotal  = s.price != null ? `£${(s.qty * s.price).toFixed(2)}` : '–';
    return `<div class="summary-item">
      <span class="s-name">${displayNumber(item)}. ${item.name}</span>
      <span class="s-qty">${s.qty} ${item.unit}</span>
      <span class="s-price">${priceStr}</span>
      <span class="s-subtotal">${subtotal}</span>
    </div>`;
  }).join('');

  if (hasAnyPrice) {
    summaryGrand.style.display = 'flex';
    document.getElementById('summary-total').textContent = `£${grand.toFixed(2)}`;
  } else {
    summaryGrand.style.display = 'none';
  }
}

function clearAll() {
  if (!confirm('ล้างข้อมูลทั้งหมด?')) return;
  // Remove custom items
  for (let i = items.length - 1; i >= 0; i--) {
    if (items[i].custom) { delete state[items[i].id]; items.splice(i,1); }
  }
  items.forEach(i => { const target = state[i.id]?.target ?? defaultTargets[i.id] ?? 0; state[i.id] = { current:0, target, qty:target, price:i.defaultPrice, note:'' }; });
  renderItems();
}

function getSupplier(item) {
  if (item.supplier) return item.supplier;
  const text = `${item.name} ${item.hint || ''}`.toLowerCase();
  if (text.includes('sainsbury') || text.includes('rubicon') || text.includes("wall's")) return "Sainsbury's";
  return 'Booker';
}

async function buildPDF() {
  const selected = orderedItems().filter(i => state[i.id].qty > 0);
  if (selected.length === 0) { alert('ไม่มีรายการที่ต้องสั่ง'); return; }

  const groups = {};
  selected.forEach(item => {
    const supplier = getSupplier(item);
    (groups[supplier] ||= []).push(item);
  });

  const dateStr = dateEl.value
    ? new Date(dateEl.value).toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'})
    : '';
  const pdfArea = document.getElementById('pdf-area');
  const {jsPDF} = window.jspdf;

  try {
    // Portrait A4 output.
    const pdf = new jsPDF({orientation:'portrait', unit:'px', format:'a4'});
    const pdfW = pdf.internal.pageSize.getWidth();
    const pdfH = pdf.internal.pageSize.getHeight();
    let firstPage = true;

    for (const supplier of supplierOrder.filter(s => groups[s]?.length)) {
      const supplierItems = groups[supplier];
      const grand = supplierItems.reduce((sum,item) => {
        const st=state[item.id];
        return sum + (st.qty>0 && st.price!=null ? st.qty*st.price : 0);
      },0);
      const hasPrice = supplierItems.some(i => state[i.id].price != null);

      // Build row HTML once, then paginate by actual rendered row height.
      const rowHTML = item => {
        const st = state[item.id];
        const priceStr = st.price != null ? `£${st.price.toFixed(2)}` : '–';
        const subtotal = st.price != null ? `£${(st.qty*st.price).toFixed(2)}` : '–';
        return `<tr>
          <td>${displayNumber(item)}</td><td><strong>${item.name}</strong></td>
          <td class="right">${priceStr}</td><td class="right"><strong>${st.qty} ${item.unit}</strong></td>
          <td class="right">${subtotal}</td><td style="font-size:9px;color:#666">${[item.hint,st.note].filter(Boolean).join(' | ')}</td>
        </tr>`;
      };

      let cursor = 0;
      let supplierPage = 1;
      while (cursor < supplierItems.length) {
        document.getElementById('pdf-date-label').textContent =
          `Supplier: ${supplier}  |  วันที่: ${dateStr}  |  ${supplierItems.length} รายการ  |  หน้า ${supplierPage}`;
        document.getElementById('pdf-footer').textContent =
          `Supplier: ${supplier} · พิมพ์: ${new Date().toLocaleString('th-TH')}`;

        const tbody = document.getElementById('pdf-rows');
        tbody.innerHTML = '';
        pdfArea.style.display = 'block';

        // Keep the rendered page below this height so no row is ever sliced.
        // Render width is scaled to fit portrait A4.
        const maxRenderHeight = 500;
        let added = 0;
        while (cursor + added < supplierItems.length) {
          const item = supplierItems[cursor + added];
          tbody.insertAdjacentHTML('beforeend', rowHTML(item));
          if (pdfArea.scrollHeight > maxRenderHeight && added > 0) {
            tbody.lastElementChild.remove();
            break;
          }
          added++;
          if (pdfArea.scrollHeight > maxRenderHeight) break; // one unusually tall row still gets its own page
        }

        const isLastSupplierPage = cursor + added >= supplierItems.length;
        if (isLastSupplierPage && hasPrice) {
          tbody.insertAdjacentHTML('beforeend', `<tr class="pdf-total-row"><td colspan="4" style="text-align:right;font-size:11px;letter-spacing:0.04em">ยอดรวม ${supplier}</td><td class="right">£${grand.toFixed(2)}</td><td></td></tr>`);
          // If total row overflows, render it on a separate final page.
          if (pdfArea.scrollHeight > maxRenderHeight && added > 0) tbody.lastElementChild.remove();
        }

        const canvas = await html2canvas(pdfArea,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
        pdfArea.style.display = 'none';
        const ratio = Math.min(pdfW/canvas.width, pdfH/canvas.height);
        const drawW = canvas.width*ratio, drawH = canvas.height*ratio;
        const x = (pdfW-drawW)/2;
        if(!firstPage) pdf.addPage('a4','portrait');
        firstPage=false;
        pdf.addImage(canvas.toDataURL('image/png'),'PNG',x,0,drawW,drawH);

        cursor += added;
        supplierPage++;
      }

      // If the total row did not fit on the last item page, give it a clean page.
      if (hasPrice) {
        const tbody = document.getElementById('pdf-rows');
        const lastRenderedHadTotal = tbody.querySelector('.pdf-total-row');
        if (!lastRenderedHadTotal) {
          document.getElementById('pdf-date-label').textContent = `Supplier: ${supplier}  |  วันที่: ${dateStr}  |  สรุปยอด`;
          tbody.innerHTML = `<tr class="pdf-total-row"><td colspan="4" style="text-align:right;font-size:12px">ยอดรวม ${supplier}</td><td class="right">£${grand.toFixed(2)}</td><td></td></tr>`;
          pdfArea.style.display='block';
          const canvas=await html2canvas(pdfArea,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});
          pdfArea.style.display='none';
          const ratio=Math.min(pdfW/canvas.width,pdfH/canvas.height);
          const drawW=canvas.width*ratio, drawH=canvas.height*ratio;
          pdf.addPage('a4','portrait');
          pdf.addImage(canvas.toDataURL('image/png'),'PNG',(pdfW-drawW)/2,0,drawW,drawH);
        }
      }
    }
    return pdf;
  } catch(e) {
    pdfArea.style.display='none'; console.error(e); alert('เกิดข้อผิดพลาดในการสร้าง PDF');
    return null;
  }
}

async function savePDF() {
  const pdf = await buildPDF();
  if (!pdf) return;
  pdf.save(`sainsburys-order-${dateEl.value||'today'}.pdf`);
}

async function sharePDF() {
  const pdf = await buildPDF();
  if (!pdf) return;
  const filename = `sainsburys-order-${dateEl.value||'today'}.pdf`;
  // Build a real PDF File object. iPhone/iPad Safari can pass this file to LINE
  // through the native Share Sheet. We intentionally do not share the page URL.
  const bytes = pdf.output('arraybuffer');
  const file = new File([bytes], filename, {type:'application/pdf', lastModified:Date.now()});

  try {
    const canFileShare = !!navigator.share && !!navigator.canShare && navigator.canShare({files:[file]});
    if (canFileShare) {
      await navigator.share({files:[file]});
      return;
    }

    // Browser/in-app browser does not support Web Share Level 2.
    // Save the actual .pdf so the user can share it from Files/Downloads to LINE.
    pdf.save(filename);
    alert('เบราว์เซอร์นี้ส่งไฟล์ PDF เข้า LINE โดยตรงไม่ได้\nบันทึกไฟล์ PDF ให้แล้ว — เปิดไฟล์ แล้วกด Share → LINE');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    console.error(e);
    pdf.save(filename);
    alert('เปิดเมนูแชร์ไฟล์ไม่ได้ จึงบันทึก PDF ให้แทน\nเปิด PDF แล้วกด Share → LINE');
  }
}


let nextCustomId = 76;

function toggleAddForm() {
  const form = document.getElementById('add-item-form');
  const btn  = document.getElementById('add-toggle-btn');
  const isOpen = form.classList.contains('open');
  form.classList.toggle('open', !isOpen);
  btn.classList.toggle('open', !isOpen);
  if (!isOpen) {
    setTimeout(() => document.getElementById('new-name').focus(), 50);
  }
}

function addNewItem() {
  const nameEl  = document.getElementById('new-name');
  const catEl   = document.getElementById('new-cat');
  const unitEl  = document.getElementById('new-unit');
  const priceEl = document.getElementById('new-price');

  const name = nameEl.value.trim();
  if (!name) {
    nameEl.style.borderColor = 'var(--accent)';
    nameEl.focus();
    setTimeout(() => nameEl.style.borderColor = '', 1500);
    return;
  }

  const price = parseFloat(priceEl.value);
  const id = nextCustomId++;

  items.push({
    id,
    name,
    hint: '',
    cat: catEl.value,
    unit: unitEl.value.trim() || 'ชิ้น',
    defaultPrice: isNaN(price) ? null : price,
    custom: true,
  });

  state[id] = { current:0, target:0, qty:0, price: isNaN(price) ? null : price, note: '' };

  // Reset form
  nameEl.value = '';
  unitEl.value = '';
  priceEl.value = '';
  catEl.value = 'other';

  // Close panel
  document.getElementById('add-item-form').classList.remove('open');
  document.getElementById('add-toggle-btn').classList.remove('open');

  renderItems();

  // Scroll to new card
  setTimeout(() => {
    const card = document.getElementById(`card-${id}`);
    if (card) card.scrollIntoView({ behavior:'smooth', block:'center' });
  }, 80);
}

// Allow Enter key in name field to submit
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('new-name').addEventListener('keydown', e => {
    if (e.key === 'Enter') addNewItem();
  });
});

function deleteItem(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  if (state[id].qty > 0) {
    if (!confirm(`ลบ "${item.name}" ออกจากรายการ?`)) return;
  }
  items.splice(items.findIndex(i => i.id === id), 1);
  delete state[id];
  renderItems();
  updateSummary();
}

renderItems();
</script>
